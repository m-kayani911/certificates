:root{
  --navy:#123B5E; --gold:#A8843A; --ink:#1E2328; --muted:#5E646B;
  --paper:#FFFDF8; --ground:#E9EDF1; --ok:#2E6B4A; --bad:#9A3B2E;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"EB Garamond", Garamond, Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  padding:32px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
.sheet{position:relative;max-width:820px;margin:0 auto;background:var(--paper);
  border:5px solid var(--navy);box-shadow:0 18px 40px rgba(18,59,94,.12)}
.sheet::before{content:"";position:absolute;inset:6px;border:1.5px solid var(--gold);pointer-events:none}
.sheet::after{content:"";position:absolute;inset:10px;border:.75px solid var(--gold);pointer-events:none}
.dia{position:absolute;width:14px;height:14px;background:var(--paper);border:1.5px solid var(--gold);transform:rotate(45deg);z-index:2}
.dia::after{content:"";position:absolute;inset:3px;background:var(--navy)}
.d1{top:-9px;left:-9px}.d2{top:-9px;right:-9px}.d3{bottom:-9px;left:-9px}.d4{bottom:-9px;right:-9px}
.ros{position:absolute;left:50%;top:52%;width:min(520px,90%);aspect-ratio:1;transform:translate(-50%,-50%);color:var(--gold);opacity:.09;pointer-events:none}
.ros svg{width:100%;height:100%;display:block}
.inner{position:relative;padding:34px clamp(22px,6vw,64px) 30px;text-align:center}
.logos{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logos img{height:56px;width:auto}.logos .nust{height:64px}
.h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,40px);letter-spacing:.12em;color:var(--navy);margin:14px 0 0;line-height:1.1}
.h2{font-family:var(--display);font-weight:500;font-size:clamp(12px,2.2vw,15px);letter-spacing:.38em;color:var(--gold);margin-top:6px;padding-left:.38em}
.flour{display:block;width:180px;height:16px;margin:12px auto 0}
form{margin:26px auto 0;max-width:470px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
label{flex-basis:100%;font-style:italic;color:var(--muted);font-size:17px}
input{flex:1 1 230px;min-width:0;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.08em;text-transform:uppercase;text-align:center;
  padding:10px 12px;border:0;border-bottom:1.5px solid var(--gold);background:transparent;color:var(--navy)}
input::placeholder{color:#B9AE97}
button{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.16em;padding:11px 22px;border:0;background:var(--navy);color:var(--paper);cursor:pointer}
button:hover{background:#0D2D48}
input:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hint{font-size:15px;color:var(--muted);margin:10px 0 0}
#out{margin-top:26px}
.lead{font-style:italic;color:var(--muted);font-size:19px}
.name{font-weight:600;font-style:italic;font-size:clamp(32px,6.5vw,52px);line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.rule{width:min(440px,90%);border-top:1px solid var(--gold);margin:6px auto 0}
.text{font-size:19px;margin-top:16px}
.title{font-family:var(--display);font-weight:600;font-size:clamp(16px,2.8vw,21px);color:var(--navy);line-height:1.35;margin-top:6px;letter-spacing:.02em}
.meta{font-size:17px;margin-top:10px}
.stamp{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:8px 18px 8px 10px;border:1.5px solid var(--ok);color:var(--ok);
  font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.16em;border-radius:999px}
.stamp svg{width:22px;height:22px}
.facts{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 28px;margin-top:14px;font-size:16px;color:var(--muted)}
.facts b{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;color:var(--navy)}
.nf{max-width:470px;margin:0 auto;padding:16px 18px;border:1px solid var(--bad);color:var(--bad);font-size:17px}
.nf strong{font-family:var(--display);letter-spacing:.12em;font-size:14px;display:block;margin-bottom:4px}
.sig{margin:30px auto 0;max-width:330px}
.sig .line{border-top:1px solid var(--ink);padding-top:6px}
.sig .nm{font-weight:600;font-size:18px}
.sig .ds{font-size:14px;color:var(--muted);line-height:1.35}
.sig .rl{font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.18em;color:var(--gold);margin-top:3px}
footer{max-width:820px;margin:16px auto 0;text-align:center;font-size:14px;color:var(--muted)}
@media (max-width:520px){body{padding-top:20px;font-size:17px}.logos img{height:40px}.logos .nust{height:46px}.inner{padding-top:26px}}
</style>
</head>

const enc = new TextEncoder();
const hex = b => [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const norm = s => (s||"").toUpperCase().replace(/[^A-Z0-9-]/g,"");
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tick='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10.5"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>';
async function verify(raw){
  const id = norm(raw), out = document.getElementById("out");
  if(!id){ out.innerHTML=""; return; }
  let rec=null;
  try{
    const r = RECORDS[hex(await crypto.subtle.digest("SHA-256", enc.encode("lookup|"+id)))];
    if(r){
      const key = await crypto.subtle.importKey("raw", await crypto.subtle.digest("SHA-256", enc.encode("key|"+id)), "AES-GCM", false, ["decrypt"]);
      rec = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(r.iv)}, key, b64(r.ct))));
    }
  }catch(e){ rec=null; }
  out.innerHTML = rec ? `
    <div class="lead">This is to certify that</div>
    <div class="name">${esc(rec.name)}</div><div class="rule"></div>
    <div class="text">has successfully participated in the 2-Day Hands-On Workshop</div>
    <div class="title">Metagenome Data Analysis for Precision Biomarker Discovery</div>

  : `<div class="nf"><strong>NOT FOUND</strong>No certificate matches ${esc(id)}. Check the ID printed on the certificate and try again, or contact the Metagenomics Discovery Lab, SINES, NUST.</div>`;
}
